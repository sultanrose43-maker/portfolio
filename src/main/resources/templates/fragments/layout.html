
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!--
    This file contains reusable HTML components.
    The navbar is written once and reused on other pages.
-->

<body>

    <!-- ===== NAVBAR ===== -->
    <header class="navbar" th:fragment="navbar">

        <nav class="container navbar-inner">

            <!-- Website Name -->
            <a href="#home"
               class="navbar-logo"
               th:text="${name}">
                Your Name
            </a>

            <!-- Mobile Menu Button -->
            <button
                class="navbar-toggle"
                aria-label="Open or close the menu"
                type="button">
                &#9776;
            </button>

            <!-- Navigation Links -->
            <ul class="navbar-links">

                <li>
                    <a href="#about">About</a>
                </li>

                <li>
                    <a href="#skills">Skills</a>
                </li>

                <li>
                    <a href="#projects">Projects</a>
                </li>

                <li>
                    <a href="#journey">Journey</a>
                </li>

                <li>
                    <a href="#contact">Contact</a>
                </li>

            </ul>

        </nav>

    </header>

</body>
</html>
